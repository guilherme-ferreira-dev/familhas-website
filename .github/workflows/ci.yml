name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  familhas-api:
    name: familhas-api (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/familhas-api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/familhas-api/pom.xml

      # Docker já vem no runner ubuntu-latest, então os testes com Testcontainers (Oracle) rodam aqui.
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/familhas-api/target/surefire-reports/
          retention-days: 7

  familhas-email:
    name: familhas-email (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/familhas-email
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/familhas-email/pom.xml

      # Testcontainers: Oracle, RabbitMQ e MailHog. O teste de contrato lê docs/events (checkout completo).
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Build da imagem Docker
        run: docker build -t familhas-email:ci .

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-familhas-email
          path: backend/familhas-email/target/surefire-reports/
          retention-days: 7

  familhas-web:
    name: familhas-web (lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/familhas-web
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/familhas-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/familhas-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Contratos em docs/api: lint do OpenAPI e tipos gerados em dia com o YAML.
      - name: Validar contratos OpenAPI
        run: |
          specs=../../docs/api/familhas-api.yaml
          [ -f ../../docs/api/checkout.yaml ] && specs="$specs ../../docs/api/checkout.yaml"
          npx --yes @redocly/cli@2.11.1 lint $specs --config ../../docs/api/redocly.yaml
          npm run api:check

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm run test:ci

      - name: Build de produção
        run: npm run build

      # O build mock não pode quebrar: é como o front roda sem backend.
      - name: Build mock
        run: npx ng build --configuration mock

  familhas-admin:
    name: familhas-admin (lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/familhas-admin
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/familhas-admin/.nvmrc
          cache: npm
          cache-dependency-path: frontend/familhas-admin/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Contrato do Admin em docs/api/admin.yaml: lint do OpenAPI e tipos gerados em dia com o YAML.
      - name: Validar contrato OpenAPI
        run: |
          npx --yes @redocly/cli@2.11.1 lint ../../docs/api/admin.yaml --config ../../docs/api/redocly.yaml
          npm run api:check

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm run test:ci

      - name: Build de produção
        run: npm run build
