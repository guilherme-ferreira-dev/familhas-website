# Perfil de produção (ADR 0018). Ative com SPRING_PROFILES_ACTIVE=prod. A API recusa subir se faltar segredo ou
# se algum endereço estiver inseguro (ProductionReadinessCheck): melhor não subir do que subir aberta.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.structured.format.console=${LOG_FORMAT:ecs}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
management.endpoint.health.show-details=never
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
