spring.datasource.url=jdbc:h2:mem:familhasdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
# Sem broker nos testes leves: o publisher do outbox fica desligado
familhas.outbox.publisher-enabled=false
# Sem job de reconciliação nos testes leves: os testes chamam a reconciliação manualmente
familhas.payments.reconciliation-enabled=false
# Sem broker nos testes leves: a planilha do Admin não consome os eventos de pagamento
familhas.admin.payment-feed.enabled=false
