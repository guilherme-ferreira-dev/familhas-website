spring.application.name=familhas-api
spring.profiles.default=local
spring.docker.compose.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Outbox (ADR 0005): o publisher espera o confirm do broker antes de marcar o evento como publicado
spring.rabbitmq.publisher-confirm-type=simple
familhas.outbox.publisher-enabled=${OUTBOX_PUBLISHER_ENABLED:true}
familhas.outbox.fixed-delay=${OUTBOX_FIXED_DELAY:PT1S}
familhas.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
familhas.outbox.confirm-timeout=${OUTBOX_CONFIRM_TIMEOUT:PT5S}
familhas.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:20}
familhas.outbox.retry-backoff=${OUTBOX_RETRY_BACKOFF:PT2S}
familhas.outbox.max-retry-backoff=${OUTBOX_MAX_RETRY_BACKOFF:PT5M}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://localhost:8443/realms/familhas}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:https://localhost:8443/realms/familhas/protocol/openid-connect/certs}
# Paginação: ?page= (0-based), ?size= (padrão 20, máximo 100), ?sort=campo,asc|desc
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Coleções LAZY carregadas em lote (IN com até 50 ids) em vez de uma query por item (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Seguranca (ADR 0004): audiencia exigida no token e origens liberadas no CORS
familhas.security.audience=${KEYCLOAK_AUDIENCE:familhas-api}
familhas.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200,http://localhost:4300,https://localhost:4300}
# Nada de detalhe de erro interno na resposta; o log guarda o suficiente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
# Provedores (ADR 0006): cache das buscas, mock e resiliência por provedor
familhas.providers.cache-ttl=${PROVIDERS_CACHE_TTL:PT2M}
familhas.providers.cache-max-size=${PROVIDERS_CACHE_MAX_SIZE:1000}
familhas.providers.mock.enabled=${PROVIDERS_MOCK_ENABLED:false}
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=${PROVIDERS_CIRCUIT_OPEN_WAIT:PT30S}
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.configs.default.timeout-duration=${PROVIDERS_TIMEOUT:PT3S}
resilience4j.timelimiter.configs.default.cancel-running-future=true
# Preço (ADR 0006): valores provisórios até o Enéas definir margem e taxas
familhas.pricing.margin-percent=${PRICING_MARGIN_PERCENT:10}
familhas.pricing.service-fee-per-passenger=${PRICING_SERVICE_FEE_PER_PASSENGER:0.00}
familhas.pricing.service-fee-currency=${PRICING_SERVICE_FEE_CURRENCY:BRL}
# Cotação (ADR 0006): validade a partir da criação
familhas.quotes.validity=${QUOTE_VALIDITY:PT24H}
# Reserva (ADR 0007): prazo para pagar, com os assentos do voo bloqueados
familhas.bookings.payment-window=${BOOKING_PAYMENT_WINDOW:PT30M}
# Stripe (ADR 0007): só chaves de teste, por variável de ambiente. Sem chave, o checkout responde 503
familhas.stripe.secret-key=${STRIPE_SECRET_KEY:}
familhas.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
familhas.stripe.api-base=${STRIPE_API_BASE:}
familhas.stripe.timeout=${STRIPE_TIMEOUT:PT10S}
familhas.stripe.max-network-retries=${STRIPE_MAX_NETWORK_RETRIES:2}
# Checkout e reconciliação (ADR 0007)
familhas.payments.web-base-url=${FAMILHAS_WEB_BASE_URL:http://localhost:4200}
familhas.payments.checkout-session-ttl=${CHECKOUT_SESSION_TTL:PT30M}
familhas.payments.pix-enabled=${STRIPE_PIX_ENABLED:true}
familhas.payments.reconciliation-enabled=${PAYMENTS_RECONCILIATION_ENABLED:true}
familhas.payments.reconciliation-fixed-delay=${PAYMENTS_RECONCILIATION_FIXED_DELAY:PT5M}
familhas.payments.reconciliation-stale-after=${PAYMENTS_RECONCILIATION_STALE_AFTER:PT10M}
# Admin (ADR 0011): exportação em streaming e SSE rodam como requisição assíncrona; o padrão do Tomcat (30 s)
# cortaria uma exportação grande. O SSE da planilha tem o próprio limite (5 min).
spring.mvc.async.request-timeout=${MVC_ASYNC_REQUEST_TIMEOUT:PT10M}
# Planilha de pagamentos do Admin (ADR 0011): consome payment.* numa fila anônima por instância e avisa por SSE
familhas.admin.payment-feed.enabled=${ADMIN_PAYMENT_FEED_ENABLED:true}
