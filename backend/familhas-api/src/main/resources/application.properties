spring.application.name=familhas-api
spring.profiles.default=local
spring.docker.compose.enabled=false
# Actuator (ADR 0012): health e info públicos, mas o detalhe do health (banco, broker, disco) só para ADMIN.
# metrics e prometheus exigem token com ROLE_ADMIN (SecurityConfig). Em produção, prefira porta de gestão interna.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROLE_ADMIN,ROLE_CRM_ADMIN
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Logs (ADR 0012): correlationId (MDC) em toda linha. LOG_FORMAT=ecs (ou logstash) troca o console por JSON
# estruturado, para coletor de logs; vazio mantém o texto legível do desenvolvimento local.
logging.pattern.correlation=[%X{correlationId:-}] 
logging.structured.format.console=${LOG_FORMAT:}
# Atrás de proxy reverso confiável, FORWARD_HEADERS_STRATEGY=native (ou framework) faz o IP do rate limit vir
# do X-Forwarded-For. Sem proxy, fica none: senão qualquer cliente forjaria o próprio IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# OpenAPI gerado do código (ADR 0012): desligado por padrão, ligado no perfil local
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=false
# Rate limiting por minuto, por usuário (token) ou IP (ADR 0012)
familhas.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
familhas.rate-limit.public-per-minute=${RATE_LIMIT_PUBLIC_PER_MINUTE:300}
familhas.rate-limit.client-read-per-minute=${RATE_LIMIT_CLIENT_READ_PER_MINUTE:300}
familhas.rate-limit.client-write-per-minute=${RATE_LIMIT_CLIENT_WRITE_PER_MINUTE:30}
familhas.rate-limit.admin-per-minute=${RATE_LIMIT_ADMIN_PER_MINUTE:600}
# Retenção (ADR 0012): limpeza diária por idade, prazos em ISO-8601
familhas.retention.enabled=${RETENTION_ENABLED:true}
familhas.retention.cron=${RETENTION_CRON:0 30 3 * * *}
familhas.retention.outbox-published=${RETENTION_OUTBOX_PUBLISHED:P30D}
familhas.retention.stripe-webhook-events=${RETENTION_STRIPE_WEBHOOK_EVENTS:P90D}
familhas.retention.expired-quotes=${RETENTION_EXPIRED_QUOTES:P90D}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Outbox (ADR 0005): o publisher espera o confirm do broker antes de marcar o evento como publicado
spring.rabbitmq.publisher-confirm-type=simple
familhas.outbox.publisher-enabled=${OUTBOX_PUBLISHER_ENABLED:true}
familhas.outbox.fixed-delay=${OUTBOX_FIXED_DELAY:PT1S}
familhas.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
familhas.outbox.confirm-timeout=${OUTBOX_CONFIRM_TIMEOUT:PT5S}
familhas.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:20}
familhas.outbox.retry-backoff=${OUTBOX_RETRY_BACKOFF:PT2S}
familhas.outbox.max-retry-backoff=${OUTBOX_MAX_RETRY_BACKOFF:PT5M}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://localhost:8443/realms/familhas}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:https://localhost:8443/realms/familhas/protocol/openid-connect/certs}
# Paginação: ?page= (0-based), ?size= (padrão 20, máximo 100), ?sort=campo,asc|desc
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# Coleções LAZY carregadas em lote (IN com até 50 ids) em vez de uma query por item (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Seguranca (ADR 0004): audiencia exigida no token e origens liberadas no CORS
familhas.security.audience=${KEYCLOAK_AUDIENCE:familhas-api}
# Realm do CRM interno (ADR 0013): sem autocadastro, MFA para admin. Tokens dele so valem em /api/crm/**
# (e, para o crm-admin, nas rotas de administracao da Loja).
familhas.security.crm.issuer-uri=${KEYCLOAK_CRM_ISSUER_URI:https://localhost:8443/realms/voe-familhas-crm}
familhas.security.crm.jwk-set-uri=${KEYCLOAK_CRM_JWK_SET_URI:https://localhost:8443/realms/voe-familhas-crm/protocol/openid-connect/certs}
familhas.security.crm.audience=${KEYCLOAK_CRM_AUDIENCE:familhas-api}
familhas.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200,http://localhost:4300,https://localhost:4300}
# Nada de detalhe de erro interno na resposta; o log guarda o suficiente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
# Provedores (ADR 0006): cache das buscas, mock e resiliência por provedor
familhas.providers.cache-ttl=${PROVIDERS_CACHE_TTL:PT2M}
familhas.providers.cache-max-size=${PROVIDERS_CACHE_MAX_SIZE:1000}
familhas.providers.mock.enabled=${PROVIDERS_MOCK_ENABLED:false}
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=${PROVIDERS_CIRCUIT_OPEN_WAIT:PT30S}
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.configs.default.timeout-duration=${PROVIDERS_TIMEOUT:PT3S}
resilience4j.timelimiter.configs.default.cancel-running-future=true
# Preço (ADR 0006): valores provisórios até o Enéas definir margem e taxas
familhas.pricing.margin-percent=${PRICING_MARGIN_PERCENT:10}
familhas.pricing.service-fee-per-passenger=${PRICING_SERVICE_FEE_PER_PASSENGER:0.00}
familhas.pricing.service-fee-currency=${PRICING_SERVICE_FEE_CURRENCY:BRL}
# Cotação (ADR 0006): validade a partir da criação
familhas.quotes.validity=${QUOTE_VALIDITY:PT24H}
# Reserva (ADR 0007): prazo para pagar, com os assentos do voo bloqueados
familhas.bookings.payment-window=${BOOKING_PAYMENT_WINDOW:PT30M}
# Stripe (ADR 0007): só chaves de teste, por variável de ambiente. Sem chave, o checkout responde 503
familhas.stripe.secret-key=${STRIPE_SECRET_KEY:}
familhas.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
familhas.stripe.api-base=${STRIPE_API_BASE:}
familhas.stripe.timeout=${STRIPE_TIMEOUT:PT10S}
familhas.stripe.max-network-retries=${STRIPE_MAX_NETWORK_RETRIES:2}
# Checkout e reconciliação (ADR 0007)
familhas.payments.web-base-url=${FAMILHAS_WEB_BASE_URL:http://localhost:4200}
familhas.payments.checkout-session-ttl=${CHECKOUT_SESSION_TTL:PT30M}
familhas.payments.pix-enabled=${STRIPE_PIX_ENABLED:true}
familhas.payments.reconciliation-enabled=${PAYMENTS_RECONCILIATION_ENABLED:true}
familhas.payments.reconciliation-fixed-delay=${PAYMENTS_RECONCILIATION_FIXED_DELAY:PT5M}
familhas.payments.reconciliation-stale-after=${PAYMENTS_RECONCILIATION_STALE_AFTER:PT10M}
# Admin (ADR 0011): exportação em streaming e SSE rodam como requisição assíncrona; o padrão do Tomcat (30 s)
# cortaria uma exportação grande. O SSE da planilha tem o próprio limite (5 min).
spring.mvc.async.request-timeout=${MVC_ASYNC_REQUEST_TIMEOUT:PT10M}
# Planilha de pagamentos do Admin (ADR 0011): consome payment.* numa fila anônima por instância e avisa por SSE
familhas.admin.payment-feed.enabled=${ADMIN_PAYMENT_FEED_ENABLED:true}

# --- CRM interno (ADR 0014) ---
# Dados da agencia (uma so). Vazio = ainda nao informado; a tela mostra "a definir".
familhas.company.legal-name=${COMPANY_LEGAL_NAME:EEBPG Ag\u00eancia de Viagens LTDA}
familhas.company.trade-name=${COMPANY_TRADE_NAME:Voe Familhas}
familhas.company.cnpj=${COMPANY_CNPJ:62.845.580/0001-75}
familhas.company.site=${COMPANY_SITE:familhas.tur.br}
familhas.company.whatsapp=${COMPANY_WHATSAPP:(61) 99990-9464}
familhas.company.email=${COMPANY_EMAIL:voefamilhas@gmail.com}
familhas.company.instagram=${COMPANY_INSTAGRAM:}
# Integracoes: so por variavel de ambiente. Provedores de IA ainda nao definidos ("none").
familhas.integrations.ai-text-provider=${AI_TEXT_PROVIDER:none}
familhas.integrations.ai-image-provider=${AI_IMAGE_PROVIDER:none}
familhas.integrations.ai-video-provider=${AI_VIDEO_PROVIDER:none}
familhas.integrations.serpapi-api-key=${SERPAPI_API_KEY:}
familhas.integrations.meta-access-token=${META_ACCESS_TOKEN:}
familhas.integrations.meta-instagram-user-id=${META_INSTAGRAM_USER_ID:}
# Storage privado: pasta fora de qualquer pasta servida; segredo dos links com 32+ caracteres em producao.
familhas.storage.local-root=${STORAGE_LOCAL_ROOT:./var/crm-files}
familhas.storage.link-secret=${STORAGE_LINK_SECRET:}
familhas.storage.link-ttl=${STORAGE_LINK_TTL:PT5M}
# Uploads: o maior tipo aceito e o MP4 do Reel (100 MB); cada tipo tem limite proprio (StoredFileType).
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
# URLs externas buscadas pelo servidor (anti-SSRF): so https por padrao.
familhas.outbound.allow-http=${OUTBOUND_ALLOW_HTTP:false}
