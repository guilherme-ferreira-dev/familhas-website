# Vale para todos os testes da familhas-api (precede o application.properties do main).
# Rate limit e retenção têm testes próprios, que ligam cada um explicitamente: nos demais, um teste que faça
# muitas chamadas com o mesmo usuário não pode receber 429, e nenhum job de limpeza pode apagar dados no meio.
familhas.rate-limit.enabled=false
familhas.retention.enabled=false
