spring.application.name=familhas-email
server.port=${EMAIL_SERVER_PORT:8081}

# Schema Oracle próprio (FAMILHAS_EMAIL), separado do schema da API (ADR 0005)
spring.datasource.url=${EMAIL_DB_URL:jdbc:oracle:thin:@//localhost:1521/FAMILHASPDB}
spring.datasource.username=${EMAIL_DB_USERNAME:familhas_email}
spring.datasource.password=${EMAIL_DB_PASSWORD:familhas_email123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Um consumidor e uma mensagem por vez: e-mail transacional tem volume baixo e o retry bloqueia a thread
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

familhas.email.from=${EMAIL_FROM:Familhas <nao-responda@familhas.com.br>}
# Retry com backoff exponencial só para falhas transitórias; depois disso, DLQ
familhas.email.retry.max-attempts=${EMAIL_RETRY_MAX_ATTEMPTS:5}
familhas.email.retry.initial-interval=${EMAIL_RETRY_INITIAL_INTERVAL:PT1S}
familhas.email.retry.multiplier=${EMAIL_RETRY_MULTIPLIER:2.0}
familhas.email.retry.max-interval=${EMAIL_RETRY_MAX_INTERVAL:PT10S}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logs do consumidor identificam a mensagem só por eventId e correlationId (MDC), nunca por dado pessoal
logging.pattern.correlation=[eventId=%X{eventId:-} correlationId=%X{correlationId:-}] 
