openapi: 3.1.0
info:
  title: Familhas API - Admin
  version: 0.10.0
  description: |
    Contrato da Fase 10 (guia, seção 8; ADR 0011): tudo o que o `familhas-admin` consome.

    - Só `/api/admin/**`, sempre com JWT do realm `familhas`, audiência `familhas-api` e `ROLE_ADMIN`.
      Sem token: 401. Token sem `ROLE_ADMIN` (cliente comum): 403.
    - Toda escrita em `/api/admin/**` e toda exportação ficam no log de auditoria (`/api/admin/audit-logs`).
    - Listas paginadas no formato `{ content, page, size, totalElements, totalPages }`; `size` máximo 100;
      ordenação só por campos da lista branca de cada recurso (fora dela: 400).
    - Datas de filtro (`from`, `to`) são dias no fuso `America/Sao_Paulo`, ambos inclusivos.
    - Dinheiro sempre em decimal com 2 casas e moeda ISO 4217 explícita.
    - Erros como Problem Details (RFC 7807, `application/problem+json`); regras de negócio trazem `code`.
    - O catálogo (`/flights`, `/hotels`, `/room-offers`, `/car-rental-offers`, `/travel-packages`, `/cities`,
      `/categories`) e `/clients` já existiam desde a Fase 2; aqui estão documentados para o Admin.
servers:
  - url: http://localhost:8080
    description: familhas-api local
tags:
  - name: dashboard
    description: Indicadores do período.
  - name: clients
    description: Clientes e abas novos, ativos e passados.
  - name: bookings
    description: Reservas (somente leitura).
  - name: payments
    description: Planilha de pagamentos, exportação e avisos em tempo real.
  - name: quotes
    description: Cotações do cliente e cotações manuais.
  - name: pricing
    description: Margem e taxa de serviço.
  - name: catalog
    description: CRUD do catálogo curado (desde a Fase 2).
  - name: audit
    description: Log de auditoria das ações do admin.
security:
  - bearerAuth: []

paths:
  /api/admin/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Indicadores do período
      description: "Período padrão: últimos 30 dias até hoje. Máximo de 366 dias."
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Indicadores.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: Clientes
      description: |
        Abas do Admin (`segment`), exclusivas entre si, nesta ordem de prioridade:
        - `ACTIVE`: tem reserva `PENDING_PAYMENT` ou `CONFIRMED`.
        - `NEW`: não é ativo, está `ACTIVE`, foi cadastrado há 30 dias ou menos e não tem reserva concluída.
        - `PAST`: não é ativo nem novo, e tem reserva `COMPLETED` ou `CANCELLED`, ou está `INACTIVE`.
        Sem `segment`, lista todos (cliente antigo sem nenhuma reserva só aparece aqui).
      parameters:
        - { name: segment, in: query, schema: { $ref: '#/components/schemas/ClientSegment' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EntityStatus' } }
        - { name: q, in: query, description: Nome ou e-mail, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - { name: sort, in: query, description: 'name, email, createdAt, updatedAt', schema: { type: string } }
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [clients]
      operationId: createClient
      summary: Cadastra cliente sem login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientRequest' }
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/clients/segments:
    get:
      tags: [clients]
      operationId: getClientSegments
      summary: Quantidade de clientes por aba
      responses:
        '200':
          description: Contagens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSegmentCounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [clients]
      operationId: getClient
      summary: Detalhe do cliente
      description: Reservas e pagamentos do cliente vêm de `/api/admin/bookings?clientId=` e `/api/admin/payments?clientId=`.
      responses:
        '200':
          description: Cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [clients]
      operationId: updateClient
      summary: Atualiza cliente
      description: O e-mail de conta com login é gerido pelo Keycloak (mudar aqui responde 409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientRequest' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [clients]
      operationId: deleteClient
      summary: Exclui cliente
      responses:
        '204': { description: Excluído. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/bookings:
    get:
      tags: [bookings]
      operationId: listBookings
      summary: Reservas
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - { name: sort, in: query, description: 'createdAt (padrão, desc), totalAmount, expiresAt, status', schema: { type: string } }
      responses:
        '200':
          description: Página de reservas. O período filtra pela criação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/bookings/{id}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Detalhe da reserva com snapshot de preço e todas as tentativas de pagamento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reserva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/payments:
    get:
      tags: [payments]
      operationId: listPayments
      summary: Planilha de pagamentos
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: dateField
          in: query
          description: Data usada no período. `CREATED` (padrão) ou `PAID`.
          schema: { type: string, enum: [CREATED, PAID], default: CREATED }
        - name: status
          in: query
          description: Pode repetir (`status=SUCCEEDED&status=REFUNDED`).
          schema: { type: array, items: { $ref: '#/components/schemas/PaymentStatus' } }
          explode: true
        - { name: method, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: installments, in: query, schema: { type: integer, minimum: 1, maximum: 24 } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: bookingId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Página de pagamentos (padrão `createdAt,desc`; ordenação por createdAt, paidAt, amount, updatedAt).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/payments/{id}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: Uma linha da planilha
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Pagamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/payments/export:
    get:
      tags: [payments]
      operationId: exportPayments
      summary: Exporta a planilha filtrada (XLSX ou CSV), em streaming
      description: |
        Mesmos filtros da listagem, sem paginação, ordenado por `createdAt`. O arquivo é gerado em streaming
        (Apache POI SXSSF no XLSX), sem carregar tudo em memória. A exportação fica na auditoria.
        CSV: UTF-8 com BOM, separador vírgula, decimal com ponto; células que começam com `=`, `+`, `-` ou `@`
        recebem `'` na frente (injeção de fórmula).
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [xlsx, csv] }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: dateField
          in: query
          schema: { type: string, enum: [CREATED, PAID], default: CREATED }
        - name: status
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/PaymentStatus' } }
          explode: true
        - { name: method, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: installments, in: query, schema: { type: integer, minimum: 1, maximum: 24 } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: bookingId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "Arquivo (`Content-Disposition: attachment; filename=pagamentos-AAAAMMDD-HHMM.xlsx|csv`)."
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/octet-stream }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/payments/stream:
    get:
      tags: [payments]
      operationId: streamPayments
      summary: Avisos em tempo real de mudança de pagamento (Server-Sent Events)
      description: |
        Alimentado pelos eventos de pagamento da Fase 6 (`payment.*` no exchange `familhas.events`).
        O aviso não traz dados pessoais: o Admin busca a linha em `GET /api/admin/payments/{id}`.

        - Primeiro evento: `ready`. Depois, `payment` a cada evento, e um comentário `: ping` a cada 25 s.
        - O servidor fecha a conexão depois de 5 minutos: o Admin reconecta com um token novo
          (o `Authorization` vai no header, nunca na URL).
        - Estornos e sessões expiradas não geram evento: o Admin também recarrega a página a cada 30 s.
      responses:
        '200':
          description: Fluxo SSE.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/PaymentStreamEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/quotes:
    get:
      tags: [quotes]
      operationId: listQuotes
      summary: Cotações (do cliente e manuais)
      parameters:
        - { name: origin, in: query, schema: { $ref: '#/components/schemas/QuoteOrigin' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/QuoteStatus' } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - { name: sort, in: query, description: 'createdAt (padrão, desc), expiresAt, totalAmount', schema: { type: string } }
      responses:
        '200':
          description: Página de cotações. `EXPIRED` é calculado na leitura.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuotePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [quotes]
      operationId: createManualQuote
      summary: Cotação manual para um cliente
      description: |
        O admin monta a cotação para o cliente (por exemplo, um atendimento que veio do WhatsApp). Os preços
        são reconsultados no provedor e calculados como na Loja; o admin só pode dar um desconto manual.
        A cotação aparece para o cliente em `/api/me/quotes` e segue o fluxo normal de reserva e pagamento.

        - `manualDiscount` + promoção do pacote não podem passar da margem: o total nunca fica abaixo de
          custo + taxa de serviço (422 `QUOTE_BELOW_COST`).
        - Cliente inativo: 422 `CLIENT_INACTIVE`.
        - `internalNote` nunca aparece para o cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualQuoteRequest' }
      responses:
        '201':
          description: Cotação criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuoteDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/quotes/{id}:
    get:
      tags: [quotes]
      operationId: getQuote
      summary: Detalhe com custo, margem e descontos
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cotação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuoteDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/pricing-settings:
    get:
      tags: [pricing]
      operationId: getPricingSettings
      summary: Margem e taxa de serviço em vigor
      description: Enquanto ninguém salvar pelo Admin, valem as variáveis de ambiente (`source = ENVIRONMENT`).
      responses:
        '200':
          description: Regras em vigor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [pricing]
      operationId: updatePricingSettings
      summary: Altera margem e taxa de serviço
      description: Vale para cotações e buscas novas. Cotações e reservas existentes mantêm o snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingSettingsRequest' }
      responses:
        '200':
          description: Regras salvas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: Ações do admin
      parameters:
        - { name: actor, in: query, description: sub ou username do admin, schema: { type: string, maxLength: 100 } }
        - { name: resource, in: query, description: 'Ex.: travel-packages, payments', schema: { type: string, maxLength: 60 } }
        - { name: action, in: query, schema: { $ref: '#/components/schemas/AuditAction' } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de registros, mais recentes primeiro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- catálogo (Fase 2 e 5)
  /api/admin/flights:
    get:
      tags: [catalog]
      operationId: listFlights
      summary: Lista Flights
      parameters:
        - { name: departureFrom, in: query, schema: { type: string, format: date } }
        - { name: departureTo, in: query, schema: { type: string, format: date } }
        - { name: originCityId, in: query, schema: { type: string, format: uuid } }
        - { name: destinationCityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EntityStatus' } }
        - { name: q, in: query, description: Companhia, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { description: Página., content: { application/json: { schema: { $ref: '#/components/schemas/FlightPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: createFlight
      summary: Cria Flight
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FlightRequest' } } } }
      responses:
        '201': { description: Criado., content: { application/json: { schema: { $ref: '#/components/schemas/Flight' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/flights/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [catalog]
      operationId: getFlight
      summary: Detalhe de Flight
      responses:
        '200': { description: Voo., content: { application/json: { schema: { $ref: '#/components/schemas/Flight' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [catalog]
      operationId: updateFlight
      summary: Atualiza Flight
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FlightRequest' } } } }
      responses:
        '200': { description: Atualizado., content: { application/json: { schema: { $ref: '#/components/schemas/Flight' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [catalog]
      operationId: deleteFlight
      summary: Exclui Flight
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/hotels:
    get:
      tags: [catalog]
      operationId: listHotels
      summary: Lista Hotels
      parameters:
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: minStars, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EntityStatus' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { description: Página., content: { application/json: { schema: { $ref: '#/components/schemas/HotelPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [catalog]
      operationId: createHotel
      summary: Cria Hotel
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HotelRequest' } } } }
      responses:
        '201': { description: Criado., content: { application/json: { schema: { $ref: '#/components/schemas/Hotel' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/admin/hotels/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [catalog]
      operationId: getHotel
      summary: Detalhe de Hotel
      responses:
        '200': { description: Hotel., content: { application/json: { schema: { $ref: '#/components/schemas/Hotel' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [catalog]
      operationId: updateHotel
      summary: Atualiza Hotel
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HotelRequest' } } } }
      responses:
        '200': { description: Atualizado., content: { application/json: { schema: { $ref: '#/components/schemas/Hotel' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [catalog]
      operationId: deleteHotel
      summary: Exclui Hotel
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/room-offers:
    get:
      tags: [catalog]
      operationId: listRoomOffers
      summary: Lista RoomOffers
      parameters:
        - { name: hotelId, in: query, schema: { type: string, format: uuid } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
