        '200': { description: Página., content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token do Keycloak (realm `familhas`), emitido para o client público `familhas-admin`
        (Authorization Code + PKCE S256), com audiência `familhas-api` e `ROLE_ADMIN` em `realm_access.roles`.

  parameters:
    IdPath: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Sort:
      name: sort
      in: query
      description: '`campo,asc|desc`'
      schema: { type: string }
    From: { name: from, in: query, description: 'Dia inicial (inclusivo, America/Sao_Paulo)', schema: { type: string, format: date } }
    To: { name: to, in: query, description: 'Dia final (inclusivo, America/Sao_Paulo)', schema: { type: string, format: date } }

  responses:
    BadRequest:
      description: Parâmetros ou corpo inválidos (`errors` traz campo -> mensagem)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Sem token ou token inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Token sem `ROLE_ADMIN`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflito com registros relacionados ou e-mail já cadastrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unprocessable:
      description: Regra de negócio (`code` estável)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ServiceUnavailable:
      description: Provedor indisponível
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    ProblemDetail:
      type: object
      required: [status, title]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          description: "Regra de negócio (ex.: QUOTE_BELOW_COST, CLIENT_INACTIVE)"
          type: string
        errors:
          description: Só em 400 de validação
          type: object
          additionalProperties: { type: string }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    EntityStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    CityType: { type: string, enum: [ORIGIN, DESTINATION] }
    CarCategory: { type: string, enum: [ECONOMY, COMPACT, SEDAN, SUV, MINIVAN, LUXURY] }
    Transmission: { type: string, enum: [MANUAL, AUTOMATIC] }
    BoardType: { type: string, enum: [ROOM_ONLY, BREAKFAST, HALF_BOARD, FULL_BOARD, ALL_INCLUSIVE] }
    PackageComponentType: { type: string, enum: [HOTEL_STAY, CAR_RENTAL] }
    PriceItemType: { type: string, enum: [FLIGHT, HOTEL_STAY, CAR_RENTAL] }
    BookingStatus: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, COMPLETED] }
    CancellationReason: { type: string, enum: [PAYMENT_EXPIRED, REFUNDED] }
    PaymentStatus: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, CANCELED, REFUNDED, PARTIALLY_REFUNDED] }
    PaymentMethod: { type: string, enum: [PIX, CREDIT_CARD] }
    QuoteStatus: { type: string, enum: [OPEN, EXPIRED, BOOKED] }
    QuoteOrigin: { type: string, enum: [CUSTOMER, ADMIN] }
    ClientSegment: { type: string, enum: [NEW, ACTIVE, PAST] }
    AuditAction: { type: string, enum: [CREATE, UPDATE, DELETE, EXPORT] }
    Currency: { type: string, pattern: '^[A-Z]{3}$', examples: [BRL] }
    Money: { type: number, description: 'BigDecimal, escala 2' }

    ClientRef:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }

    Client:
      type: object
      required: [id, name, email, status, hasLogin, favoriteIds, myFlightIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phoneNumber: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/EntityStatus' }
        hasLogin: { type: boolean, description: Conta já vinculada ao Keycloak }
        favoriteIds: { type: array, items: { type: string, format: uuid } }
        myFlightIds: { type: array, items: { type: string, format: uuid } }
    ClientRequest:
      type: object
      required: [name, email, status]
      properties:
        name: { type: string, maxLength: 180 }
        email: { type: string, format: email, maxLength: 180 }
        phoneNumber: { type: [string, 'null'], maxLength: 40 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        favoriteIds: { type: [array, 'null'], items: { type: string, format: uuid }, description: 'null mantém os atuais' }
        myFlightIds: { type: [array, 'null'], items: { type: string, format: uuid }, description: 'null mantém os atuais' }
    ClientPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/Client' } }
    ClientSegmentCounts:
      type: object
      required: [all, new, active, past]
      properties:
        all: { type: integer, format: int64 }
        new: { type: integer, format: int64 }
        active: { type: integer, format: int64 }
        past: { type: integer, format: int64 }

    AdminBookingSummary:
      type: object
      required: [id, status, client, passengers, currency, totalAmount, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        client: { $ref: '#/components/schemas/ClientRef' }
        travelPackageId: { type: [string, 'null'], format: uuid }
        travelPackageTitle: { type: [string, 'null'] }
        passengers: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        startDate: { type: [string, 'null'], format: date, description: Início do primeiro item }
        expiresAt: { type: string, format: date-time, description: Prazo para pagar }
        latestPaymentStatus:
          oneOf:
            - { $ref: '#/components/schemas/PaymentStatus' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
    AdminBookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminBookingSummary' } }
    PricedItem:
      type: object
      required: [type, description, startDate, endDate, quantity, unitPrice, currency, subtotal, provider]
      properties:
        type: { $ref: '#/components/schemas/PriceItemType' }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money', description: Custo unitário (sem margem) }
        currency: { $ref: '#/components/schemas/Currency' }
        subtotal: { $ref: '#/components/schemas/Money', description: Custo do item (sem margem) }
        provider: { type: string }
    PriceSnapshot:
      type: object
      required: [componentsTotal, marginPercent, marginAmount, promotionPercent, discountAmount, serviceFeeAmount, totalAmount]
      properties:
        componentsTotal: { $ref: '#/components/schemas/Money', description: Custo dos itens }
        marginPercent: { type: number }
        marginAmount: { $ref: '#/components/schemas/Money' }
        promotionPercent: { type: number }
        discountAmount: { $ref: '#/components/schemas/Money', description: Promoção + desconto manual }
        serviceFeeAmount: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
    AdminBookingDetail:
      allOf:
        - $ref: '#/components/schemas/AdminBookingSummary'
        - $ref: '#/components/schemas/PriceSnapshot'
        - type: object
          required: [quoteId, items, payments]
          properties:
            quoteId: { type: string, format: uuid }
            confirmedAt: { type: [string, 'null'], format: date-time }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancellationReason:
              oneOf:
                - { $ref: '#/components/schemas/CancellationReason' }
                - { type: 'null' }
            items: { type: array, items: { $ref: '#/components/schemas/PricedItem' } }
            payments:
              description: Todas as tentativas, da mais recente para a mais antiga
              type: array
              items: { $ref: '#/components/schemas/AdminPayment' }

    AdminPayment:
      type: object
      required: [id, bookingId, client, method, status, installments, amount, refundedAmount, currency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/ClientRef' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        installments: { type: integer, description: Sempre 1 até o parcelamento ser liberado (ADR 0008) }
        amount: { $ref: '#/components/schemas/Money' }
        refundedAmount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        paidAt: { type: [string, 'null'], format: date-time }
        failureCode: { type: [string, 'null'] }
        stripePaymentIntentId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPaymentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminPayment' } }
    PaymentStreamEvent:
      description: 'Dado do evento SSE `payment` (JSON). O evento `ready` vem com `{}`.'
      type: object
      required: [eventType, paymentId, bookingId, occurredAt]
      properties:
        eventType: { type: string, examples: [PaymentConfirmed, PaymentFailed] }
        paymentId: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [from, to, revenue, dailyRevenue, paymentsByStatus, bookingsByStatus, newClients, pendingBookings, openQuotes]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        revenue:
          description: Pagamentos aprovados no período (por `paidAt`), por moeda
          type: array
          items:
            type: object
            required: [currency, gross, refunded, net, count]
            properties:
              currency: { $ref: '#/components/schemas/Currency' }
              gross: { $ref: '#/components/schemas/Money' }
              refunded: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }
              count: { type: integer, format: int64 }
        dailyRevenue:
          description: Receita líquida por dia (America/Sao_Paulo) e moeda; dias sem venda não aparecem
          type: array
          items:
            type: object
            required: [date, currency, net]
            properties:
              date: { type: string, format: date }
              currency: { $ref: '#/components/schemas/Currency' }
              net: { $ref: '#/components/schemas/Money' }
        paymentsByStatus:
          description: Tentativas criadas no período, por status
          type: object
          additionalProperties: { type: integer, format: int64 }
        bookingsByStatus:
          description: Reservas criadas no período, por status
          type: object
          additionalProperties: { type: integer, format: int64 }
        newClients: { type: integer, format: int64, description: Clientes cadastrados no período }
        pendingBookings: { type: integer, format: int64, description: Reservas aguardando pagamento agora }
        openQuotes: { type: integer, format: int64, description: Cotações válidas agora }

    ManualQuoteRequest:
      type: object
      required: [clientId, passengers]
      description: |
        Ou `travelPackageId`, ou ao menos um item avulso (`flight`, `hotel`, `car`), nunca os dois.
        O `offerId` de um item do catálogo curado é `curated:{id}` (id do voo, do quarto ou do carro em
        `/api/admin/flights`, `/room-offers` e `/car-rental-offers`).
      properties:
        clientId: { type: string, format: uuid }
        passengers: { type: integer, minimum: 1, maximum: 9 }
        travelPackageId: { type: [string, 'null'], format: uuid }
        flight:
          type: [object, 'null']
          required: [offerId]
          properties:
            offerId: { type: string, maxLength: 500 }
        hotel:
          type: [object, 'null']
          required: [offerId, checkIn, checkOut]
          properties:
            offerId: { type: string, maxLength: 500 }
            checkIn: { type: string, format: date }
            checkOut: { type: string, format: date }
        car:
          type: [object, 'null']
          required: [offerId, pickUpDate, dropOffDate]
          properties:
            offerId: { type: string, maxLength: 500 }
            pickUpDate: { type: string, format: date }
            dropOffDate: { type: string, format: date }
        manualDiscount: { type: [number, 'null'], minimum: 0, description: 'Desconto em valor, na moeda da cotação' }
        validityHours: { type: [integer, 'null'], minimum: 1, maximum: 720, description: 'Padrão: validade da Loja (24 h)' }
        internalNote: { type: [string, 'null'], maxLength: 500, description: Só o Admin vê }
    AdminQuoteSummary:
      type: object
      required: [id, status, origin, client, passengers, currency, totalAmount, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        origin: { $ref: '#/components/schemas/QuoteOrigin' }
        client: { $ref: '#/components/schemas/ClientRef' }
        travelPackageId: { type: [string, 'null'], format: uuid }
        passengers: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AdminQuotePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminQuoteSummary' } }
    AdminQuoteDetail:
      allOf:
        - $ref: '#/components/schemas/AdminQuoteSummary'
        - $ref: '#/components/schemas/PriceSnapshot'
        - type: object
          required: [items, manualDiscountAmount]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/PricedItem' } }
            manualDiscountAmount: { $ref: '#/components/schemas/Money' }
            internalNote: { type: [string, 'null'] }
            createdBy: { type: [string, 'null'], description: Username do admin que criou (cotação manual) }
            bookingId: { type: [string, 'null'], format: uuid }

    PricingSettings:
      type: object
      required: [marginPercent, serviceFeePerPassenger, serviceFeeCurrency, source]
      properties:
        marginPercent: { type: number, minimum: 0, maximum: 100 }
        serviceFeePerPassenger: { $ref: '#/components/schemas/Money' }
        serviceFeeCurrency: { $ref: '#/components/schemas/Currency' }
        source: { type: string, enum: [DATABASE, ENVIRONMENT] }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    PricingSettingsRequest:
      type: object
      required: [marginPercent, serviceFeePerPassenger, serviceFeeCurrency]
      properties:
        marginPercent: { type: number, minimum: 0, maximum: 100 }
        serviceFeePerPassenger: { type: number, minimum: 0 }
        serviceFeeCurrency: { $ref: '#/components/schemas/Currency' }

    AuditLog:
      type: object
      required: [id, actorSubject, action, resource, httpMethod, path, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorSubject: { type: string, description: 'sub do token' }
        actorUsername: { type: [string, 'null'] }
        action: { $ref: '#/components/schemas/AuditAction' }
        resource: { type: string }
        resourceId: { type: [string, 'null'] }
        httpMethod: { type: string }
        path: { type: string }
        status: { type: integer, description: Status HTTP da resposta }
        details: { type: [string, 'null'], description: 'Ex.: filtros da exportação. Nunca o corpo da requisição.' }
        occurredAt: { type: string, format: date-time }
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

