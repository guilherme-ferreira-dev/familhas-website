          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredBackup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/crm/backups/{id}/download:
    get:
      tags: [backups]
      operationId: downloadStoredBackup
      summary: Baixa um backup guardado
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/backups/restore:
    post:
      tags: [backups]
      operationId: restoreBackup
      summary: Prévia (padrão) ou restauração
      description: |
        Exige `crm:backup:restaurar` (admin). Nunca sobrescreve: registro que existe fica como está; só volta o que
        foi apagado. Tudo numa transação. Erros 422: `BACKUP_INVALID`, `BACKUP_VERSION`, `BACKUP_CHECKSUM`,
        `BACKUP_TOO_LARGE`.
      parameters:
        - { name: apply, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/privacy/subject-report:
    post:
      tags: [privacy]
      operationId: subjectReport
      summary: Dados do titular pelo CPF (pedido de acesso)
      description: "Exige `crm:privacidade:exportar` e identidade confirmada. Auditado com o protocolo e o CPF mascarado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/privacy/anonymize:
    post:
      tags: [privacy]
      operationId: anonymizeSubject
      summary: Prévia (padrão) ou anonimização do titular
      description: |
        Exige `crm:privacidade:excluir`. Mantém voos que não terminaram e vouchers dentro do prazo legal
        (`PRIVACY_VOUCHER_RETENTION`, padrão 5 anos). Nada é apagado: nome, CPF, telefone, observações e outros
        passageiros do voucher saem.
      parameters:
        - { name: apply, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymizationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/privacy/incidents:
    get:
      tags: [privacy]
      operationId: listIncidents
      summary: Registro de incidentes, mais recentes primeiro
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [privacy]
      operationId: createIncident
      summary: Registra incidente
      description: "Erros 422: `CONTAINED_AT_REQUIRED`, `CLOSED_AT_REQUIRED`, `INCIDENT_DATES_INVALID`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentRequest' }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/privacy/incidents/{id}:
    put:
      tags: [privacy]
      operationId: updateIncident
      summary: Atualiza incidente (exige version)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentRequest' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token do Keycloak (realm `voe-familhas-crm`), emitido para o client público `familhas-crm`
        (Authorization Code + PKCE S256), com audiência `familhas-api` e um papel do CRM em `realm_access.roles`.

  parameters:
    IdPath: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  responses:
    BadRequest:
      description: Parâmetros ou corpo inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Sem token ou token inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Token sem o papel ou a permissão exigida (ou link de arquivo inválido)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: 'Conflito (`code` estável, ex.: VERSION_CONFLICT, GROUP_NAME_TAKEN)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ServiceUnavailable:
      description: Integração não configurada (`INTEGRATION_NOT_CONFIGURED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unprocessable:
      description: Regra de negócio (`code` estável)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    ProblemDetail:
      type: object
      required: [status, title]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Ex.: FILE_TYPE_MISMATCH, INTEGRATION_NOT_CONFIGURED' }
        errors: { type: object, additionalProperties: { type: string } }

    CrmRole: { type: string, enum: [ADMIN, GESTOR, ATENDENTE, MARKETING] }

    CrmMe:
      type: object
      required: [subject, roles, permissions]
      properties:
        subject: { type: string }
        username: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        roles: { type: array, items: { $ref: '#/components/schemas/CrmRole' } }
        permissions:
          type: array
          description: '`crm:<recurso>:<ação>`, ex.: `crm:vouchers:criar`'
          items: { type: string }

    Company:
      type: object
      description: Dados fixos da agência. String vazia = ainda não informado.
      required: [legalName, tradeName, cnpj, site, whatsapp, email, instagram]
      properties:
        legalName: { type: string, examples: ['EEBPG Agência de Viagens LTDA'] }
        tradeName: { type: string, examples: ['Voe Familhas'] }
        cnpj: { type: string, examples: ['62.845.580/0001-75'] }
        site: { type: string, examples: ['familhas.tur.br'] }
        whatsapp: { type: string, examples: ['(61) 99990-9464'] }
        email: { type: string }
        instagram: { type: string }

    IntegrationKey: { type: string, enum: [AI_TEXT, AI_IMAGE, AI_VIDEO, FLIGHT_SEARCH, INSTAGRAM, TEAM_DIRECTORY, EMAIL] }

    IntegrationStatus:
      type: object
      required: [key, label, configured, detail]
      properties:
        key: { $ref: '#/components/schemas/IntegrationKey' }
        label: { type: string }
        configured: { type: boolean }
        detail: { type: string }

    CrmSettings:
      type: object
      required: [company, integrations]
      properties:
        company: { $ref: '#/components/schemas/Company' }
        integrations: { type: array, items: { $ref: '#/components/schemas/IntegrationStatus' } }

    FileCategory:
      type: string
      description: |
        Decide a permissão e os tipos aceitos:
        `DOCUMENT` (documentos; PDF e imagens), `FLIGHT_ATTACHMENT` (voos-clientes; PDF, JPG, PNG),
        `VOUCHER_SOURCE` (vouchers; PDF, JPG, PNG), `POST_IMAGE` (posts-cotacao; imagens e PDF de orçamento),
        `INSTAGRAM_MEDIA` (posts-insta; imagens e MP4), `ITINERARY_PHOTO` (roteiros; fotos e PDF de orçamento),
        `BRAND_ASSET` (dashboard; logo PNG/WEBP: todos leem, admin e gestor trocam).
      enum: [DOCUMENT, FLIGHT_ATTACHMENT, VOUCHER_SOURCE, POST_IMAGE, INSTAGRAM_MEDIA, ITINERARY_PHOTO, BRAND_ASSET]

    CrmFile:
      type: object
      required: [id, category, name, contentType, sizeBytes, sha256, uploadedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/FileCategory' }
        name: { type: string, description: 'Nome para exibição, já saneado e com a extensão do tipo real' }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp, video/mp4] }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }

    CrmFilePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/CrmFile' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    FileLink:
      type: object
      required: [path, expiresAt]
      properties:
        path: { type: string, description: 'Relativo à API, ex.: /api/crm/files/{id}/content?expires=...&signature=...' }
        expiresAt: { type: string, format: date-time }

    LocalDateTime: { type: string, description: 'Horário local do bilhete, sem fuso (2026-12-10T08:30:00)', examples: ['2026-12-10T08:30:00'] }

    ClientFlightSummary:
      type: object
      required: [id, airline, origin, destination, outboundAt, passengers, attachmentCount, archived]
      properties:
        id: { type: string, format: uuid }
        locator: { type: [string, 'null'] }
        airline: { type: string }
        origin: { type: string }
        destination: { type: string }
        outboundAt: { $ref: '#/components/schemas/LocalDateTime' }
        returnAt: { oneOf: [ { $ref: '#/components/schemas/LocalDateTime' }, { type: 'null' } ] }
        passengers: { type: array, items: { type: string } }
        attachmentCount: { type: integer }
        archived: { type: boolean }

    ClientFlightPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ClientFlightSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    ClientFlightTravelerRequest:
      type: object
      required: [fullName]
      properties:
        id: { type: [string, 'null'], format: uuid, description: Passageiro existente (mantém o CPF guardado quando cpf é null) }
        fullName: { type: string, maxLength: 150 }
        cpf: { type: [string, 'null'], maxLength: 14, description: 'null mantém; vazio apaga; preenchido é validado' }
        phone: { type: [string, 'null'], maxLength: 20 }

    ClientFlightRequest:
      type: object
      required: [airline, origin, destination, outboundAt, travelers]
      properties:
        locator: { type: [string, 'null'], maxLength: 20 }
        airline: { type: string, maxLength: 60 }
        origin: { type: string, maxLength: 60 }
        destination: { type: string, maxLength: 60 }
        outboundAt: { $ref: '#/components/schemas/LocalDateTime' }
        outboundFlightNumber: { type: [string, 'null'], maxLength: 20 }
        returnAt: { oneOf: [ { $ref: '#/components/schemas/LocalDateTime' }, { type: 'null' } ] }
        returnFlightNumber: { type: [string, 'null'], maxLength: 20 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        travelers: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ClientFlightTravelerRequest' } }
        version: { type: [integer, 'null'], format: int64, description: Obrigatório na edição }

    ClientFlightTraveler:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        cpfMasked: { type: [string, 'null'], examples: ['***.982.247-**'] }
        phone: { type: [string, 'null'] }

    ClientFlight:
      type: object
      required: [id, airline, origin, destination, outboundAt, archived, travelers, attachments, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        locator: { type: [string, 'null'] }
        airline: { type: string }
        origin: { type: string }
        destination: { type: string }
        outboundAt: { $ref: '#/components/schemas/LocalDateTime' }
        outboundFlightNumber: { type: [string, 'null'] }
        returnAt: { oneOf: [ { $ref: '#/components/schemas/LocalDateTime' }, { type: 'null' } ] }
        returnFlightNumber: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        archived: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
        travelers: { type: array, items: { $ref: '#/components/schemas/ClientFlightTraveler' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/CrmFile' } }
        version: { type: integer, format: int64 }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MonthCount:
      type: object
      required: [month, count]
      properties:
        month: { type: string, examples: ['2026-12'] }
        count: { type: integer, format: int64 }

    CrmDashboard:
      type: object
      required: [flights, vouchers]
      properties:
        flights:
          oneOf:
            - type: 'null'
            - type: object
              required: [next7Days, next30Days, upcoming, byMonth]
              properties:
                next7Days: { type: integer, format: int64 }
                next30Days: { type: integer, format: int64 }
                upcoming: { type: array, items: { $ref: '#/components/schemas/ClientFlightSummary' } }
                byMonth: { type: array, items: { $ref: '#/components/schemas/MonthCount' } }
        vouchers:
          oneOf:
            - type: 'null'
            - type: object
              required: [issuedThisMonth, byTypeThisMonth]
              properties:
                issuedThisMonth: { type: integer, format: int64 }
                byTypeThisMonth:
                  type: object
                  required: [FLIGHT, HOTEL, TRANSFER, TOUR]
                  properties:
                    FLIGHT: { type: integer, format: int64 }
                    HOTEL: { type: integer, format: int64 }
                    TRANSFER: { type: integer, format: int64 }
                    TOUR: { type: integer, format: int64 }

    FlightSearchMode: { type: string, enum: [EXACT, FLEXIBLE] }

    FlightSearchRequest:
      type: object
      required: [origin, destinations, mode]
      properties:
        origin: { type: string, pattern: '^[A-Z]{3}$' }
        destinations: { type: array, minItems: 1, maxItems: 7, items: { type: string, pattern: '^[A-Z]{3}$' } }
        mode: { $ref: '#/components/schemas/FlightSearchMode' }
        departureDate: { type: [string, 'null'], format: date, description: EXACT }
        returnDate: { type: [string, 'null'], format: date, description: EXACT }
        months: { type: [array, 'null'], maxItems: 3, items: { type: string, examples: ['2026-12'] }, description: FLEXIBLE }
        stayNights: { type: [integer, 'null'], minimum: 1, maximum: 30, description: 'FLEXIBLE, padrão 5' }
        adults: { type: [integer, 'null'], minimum: 1, maximum: 9, description: 'Padrão 1' }

    FlightOffer:
      type: object
      required: [departureDate, returnDate, price, currency, airlines, stops]
      properties:
        departureDate: { type: string, format: date }
        returnDate: { type: string, format: date }
        price: { type: number, description: 'Total ida + volta por adulto' }
        currency: { type: string, examples: [BRL] }
        airlines: { type: array, items: { type: string } }
        stops: { type: integer }
        durationMinutes: { type: [integer, 'null'] }

    FlightSearchResult:
      type: object
      required: [request, destinations]
      properties:
        request: { $ref: '#/components/schemas/FlightSearchRequest' }
        destinations:
          type: array
          items:
            type: object
            required: [destination, offers]
            properties:
              destination: { type: string }
              offers: { type: array, items: { $ref: '#/components/schemas/FlightOffer' } }
              error: { type: [string, 'null'] }

    RecentFlightSearch:
      type: object
      required: [id, summary, request, lastRunAt]
      properties:
        id: { type: string, format: uuid }
        summary: { type: string }
        request: { $ref: '#/components/schemas/FlightSearchRequest' }
        runBy: { type: [string, 'null'] }
        lastRunAt: { type: string, format: date-time }

    FlightSearchOptions:
      type: object
      required: [origins, configured, defaultStayNights, maxDestinations, maxMonths]
      properties:
        origins: { type: array, items: { type: string } }
        configured: { type: boolean }
        defaultStayNights: { type: integer }
        maxDestinations: { type: integer }
        maxMonths: { type: integer }

    FlightSearchGroupRequest:
      type: object
      required: [name, destinations]
      properties:
        name: { type: string, maxLength: 60 }
        destinations: { type: array, minItems: 1, maxItems: 7, items: { type: string, pattern: '^[A-Z]{3}$' } }

    FlightSearchGroup:
      type: object
      required: [id, name, destinations]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        destinations: { type: array, items: { type: string } }

    VoucherType: { type: string, enum: [FLIGHT, HOTEL, TRANSFER, TOUR] }
    VoucherStatus: { type: string, enum: [ISSUED, CANCELLED] }

    VoucherDetails:
      type: object
      description: |
        Campos do serviço. Obrigatórios: FLIGHT provider, origin, destination, serviceDate; HOTEL provider,
        serviceDate, endDate; TRANSFER origin, destination, serviceDate; TOUR description, serviceDate.
      properties:
        provider: { type: [string, 'null'], maxLength: 120, description: 'Companhia, hotel ou empresa' }
        reservationCode: { type: [string, 'null'], maxLength: 30 }
        origin: { type: [string, 'null'], maxLength: 120 }
        destination: { type: [string, 'null'], maxLength: 120 }
        location: { type: [string, 'null'], maxLength: 200 }
        serviceDate: { type: [string, 'null'], format: date, description: 'Ida, check-in ou dia do serviço' }
        startTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endDate: { type: [string, 'null'], format: date, description: Volta ou check-out }
        endTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        flightNumber: { type: [string, 'null'], maxLength: 20 }
        returnFlightNumber: { type: [string, 'null'], maxLength: 20 }
        roomType: { type: [string, 'null'], maxLength: 120 }
        board: { type: [string, 'null'], maxLength: 60 }
        vehicle: { type: [string, 'null'], maxLength: 60 }
        description: { type: [string, 'null'], maxLength: 300 }
        inclusions: { type: [string, 'null'], maxLength: 1000 }
        adults: { type: [integer, 'null'], minimum: 0, maximum: 20 }
        children: { type: [integer, 'null'], minimum: 0, maximum: 20 }
        passengers: { type: [array, 'null'], maxItems: 10, items: { type: string, maxLength: 150 } }

    VoucherRequest:
      type: object
      required: [type, clientName, details]
      properties:
        type: { $ref: '#/components/schemas/VoucherType' }
        clientName: { type: string, maxLength: 150 }
        clientCpf: { type: [string, 'null'], maxLength: 14, description: 'Na edição: null mantém, vazio apaga' }
        clientPhone: { type: [string, 'null'], maxLength: 20 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        details: { $ref: '#/components/schemas/VoucherDetails' }
        sourceFileId: { type: [string, 'null'], format: uuid, description: Arquivo VOUCHER_SOURCE de origem }
        version: { type: [integer, 'null'], format: int64 }

    Voucher:
      type: object
      required: [id, number, type, status, clientName, details, issuedAt, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ['VF-000001'] }
        type: { $ref: '#/components/schemas/VoucherType' }
        status: { $ref: '#/components/schemas/VoucherStatus' }
        clientName: { type: string }
        clientCpfMasked: { type: [string, 'null'] }
        clientPhone: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        details: { $ref: '#/components/schemas/VoucherDetails' }
        serviceDate: { type: [string, 'null'], format: date }
        sourceFile: { oneOf: [ { $ref: '#/components/schemas/CrmFile' }, { type: 'null' } ] }
        issuedBy: { type: [string, 'null'] }
        issuedAt: { type: string, format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64 }

    VoucherSummary:
      type: object
      required: [id, number, type, status, clientName, issuedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        type: { $ref: '#/components/schemas/VoucherType' }
        status: { $ref: '#/components/schemas/VoucherStatus' }
        clientName: { type: string }
        provider: { type: [string, 'null'] }
        serviceDate: { type: [string, 'null'], format: date }
        issuedBy: { type: [string, 'null'] }
        issuedAt: { type: string, format: date-time }

    VoucherPage:
      type: object
