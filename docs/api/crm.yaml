      required: [format, version, createdAt, tables, sha256]
      properties:
        format: { type: string, const: voe-familhas-crm-backup }
        version: { type: integer, const: 1 }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        tables: { type: object, additionalProperties: true }
        sha256: { type: string }

    RestoreReport:
      type: object
