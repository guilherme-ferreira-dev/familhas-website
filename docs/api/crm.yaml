openapi: 3.1.0
info:
  title: Familhas API - CRM interno Voe Familhas
  version: 0.6.0
  description: |
    Contrato do CRM interno (prompt mestre do CRM; ADR 0013 e ADR 0014): tudo o que o `familhas-admin` consome
    em `/api/crm/**`.

    - Sempre com JWT do realm `voe-familhas-crm`, audiência `familhas-api` e um papel do CRM
      (`crm-admin`, `crm-gestor`, `crm-atendente`, `crm-marketing`). Sem token: 401. Token da Loja ou sem papel: 403.
    - Cada operação exige uma permissão `crm:<recurso>:<ação>` (matriz no ADR 0013). Sem ela: 403.
    - Única rota sem token: `GET /api/crm/files/{id}/content`, só com link assinado (`expires` + `signature`)
      emitido por `POST /api/crm/files/{id}/link`, válido por poucos minutos.
    - Toda escrita fica no log de auditoria (recurso `crm/<segmento>`), assim como cada link de download emitido.
    - Erros como Problem Details (RFC 7807); regras de negócio trazem `code`. Integração sem credencial:
      503 com `code` `INTEGRATION_NOT_CONFIGURED`.
servers:
  - url: http://localhost:8080
    description: familhas-api local
tags:
  - name: session
    description: Quem está logado e o que pode fazer.
  - name: settings
    description: Dados da agência e situação das integrações.
  - name: files
    description: Arquivos privados (documentos, anexos, imagens, vídeos).
  - name: dashboard
    description: Visão geral operacional (sem faturas).
  - name: client-flights
    description: Voos Clientes (voo_flights e voo_travelers).
  - name: flight-search
    description: Pesquisar Voos (SerpApi / Google Flights).
  - name: vouchers
    description: Emitir Voucher e histórico.
  - name: brand
    description: Logo oficial (composta nos posts, nunca recriada pela IA).
  - name: instagram
    description: Fila de posts do Instagram e publicação pela Meta.
  - name: marketing
    description: IA dos posts de cotação e de cruzeiros (503 sem provedor).
  - name: itineraries
    description: Gerar Roteiro (proposta comercial A4).
  - name: team
    description: Equipe (Admin API do Keycloak; só admin altera).
  - name: backups
    description: Backup lógico e restauração.
  - name: privacy
    description: LGPD (pedidos de titular e registro de incidentes; só admin).
security:
  - bearerAuth: []

paths:
  /api/crm/me:
    get:
      tags: [session]
      operationId: getCrmMe
      summary: Perfil e permissões do membro da equipe
      description: Só para montar menu e botões. A API confere a permissão em cada chamada.
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crm/settings:
    get:
      tags: [settings]
      operationId: getCrmSettings
      summary: Dados da agência e integrações
      description: "Exige `crm:dashboard:ler`. Nunca devolve credenciais."
      responses:
        '200':
          description: Configuração visível para a equipe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crm/files:
    get:
      tags: [files]
      operationId: searchCrmFiles
      summary: Arquivos de uma categoria, mais recentes primeiro
      description: "Exige `crm:<recurso da categoria>:ler`. `name` busca parte do nome, sem diferenciar maiúsculas."
      parameters:
        - { name: category, in: query, required: true, schema: { $ref: '#/components/schemas/FileCategory' } }
        - { name: name, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de arquivos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmFilePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [files]
      operationId: uploadCrmFile
      summary: Envia um arquivo
      description: |
        Exige `crm:<recurso da categoria>:criar`. O tipo vem dos primeiros bytes, não do nome.
        Limites: PDF 15 MB, imagens 10 MB, MP4 100 MB. Tipos por categoria em `FileCategory`.
        Erros: `FILE_EMPTY` (400), `FILE_TOO_LARGE` (413), `FILE_TYPE_NOT_ALLOWED` e `FILE_TYPE_MISMATCH` (415).
      parameters:
        - { name: category, in: query, required: true, schema: { $ref: '#/components/schemas/FileCategory' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Arquivo guardado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/files/{id}:
    get:
      tags: [files]
      operationId: getCrmFile
      summary: Metadados de um arquivo
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Arquivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [files]
      operationId: deleteCrmFile
      summary: Exclui um arquivo
      description: "Exige `crm:<recurso da categoria>:excluir`."
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '204': { description: Excluído. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/files/{id}/link:
    post:
      tags: [files]
      operationId: createCrmFileLink
      summary: Link de download assinado e de curta duração
      description: "Exige `crm:<recurso da categoria>:ler`. Cada emissão vai para a auditoria (`DOWNLOAD`)."
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/files/{id}/content:
    get:
      tags: [files]
      operationId: getCrmFileContent
      summary: Conteúdo por link assinado (sem token)
      description: |
        Use o `path` devolvido por `/link`. Link inválido, vencido ou de arquivo excluído: 403 `FILE_LINK_INVALID`.
        A resposta vem com `Content-Security-Policy: default-src 'none'; sandbox` e `Cache-Control: private, no-store`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: expires, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Conteúdo do arquivo.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crm/dashboard:
    get:
      tags: [dashboard]
      operationId: getCrmDashboard
      summary: Voos próximos, voos por mês e vouchers do mês
      description: "Exige `crm:dashboard:ler`. `flights` vem null sem `crm:voos-clientes:ler`; `vouchers`, sem `crm:vouchers:ler`."
      responses:
        '200':
          description: Painel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crm/client-flights:
    get:
      tags: [client-flights]
      operationId: searchClientFlights
      summary: Voos pela data da ida (ativos) ou mais recentes primeiro (arquivados)
      description: |
        Exige `crm:voos-clientes:ler`. `q`: busca rápida por passageiro, sem acento e com as palavras em qualquer
        ordem (todas no nome do mesmo passageiro), ou o localizador exato.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: from, in: query, description: 'Ida a partir do dia', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Ida até o dia', schema: { type: string, format: date } }
        - { name: airline, in: query, schema: { type: string, maxLength: 60 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - { name: sort, in: query, description: 'outboundAt, airline, destination, createdAt', schema: { type: string } }
      responses:
        '200':
          description: Página de voos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlightPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [client-flights]
      operationId: createClientFlight
      summary: Cadastra voo com passageiros
      description: "Exige `crm:voos-clientes:criar`. Erros: `CPF_INVALID`, `RETURN_BEFORE_OUTBOUND` (422)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientFlightRequest' }
      responses:
        '201':
          description: Voo criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/client-flights/{id}:
    get:
      tags: [client-flights]
      operationId: getClientFlight
      summary: Voo com passageiros (CPF mascarado) e anexos
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Voo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [client-flights]
      operationId: updateClientFlight
      summary: Edita voo
      description: "Exige `crm:voos-clientes:editar` e `version` atual (senão 409 `VERSION_CONFLICT`)."
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientFlightRequest' }
      responses:
        '200':
          description: Voo atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [client-flights]
      operationId: deleteClientFlight
      summary: Exclui voo e anexos
      description: "Exige `crm:voos-clientes:excluir`."
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '204': { description: Excluído. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/client-flights/{id}/archive:
    post:
      tags: [client-flights]
      operationId: archiveClientFlight
      summary: Arquiva (vai para o histórico)
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Voo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/client-flights/{id}/unarchive:
    post:
      tags: [client-flights]
      operationId: unarchiveClientFlight
      summary: Volta para os ativos
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '200':
          description: Voo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/client-flights/{id}/attachments:
    post:
      tags: [client-flights]
      operationId: attachToClientFlight
      summary: Anexa documento do voo (PDF, JPG, PNG)
      description: "Exige `crm:voos-clientes:editar` e `criar`. Até 20 anexos (`TOO_MANY_ATTACHMENTS`). Mesmas regras de `/api/crm/files`."
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Voo com o anexo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/Unprocessable' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/client-flights/{id}/attachments/{fileId}:
    delete:
      tags: [client-flights]
      operationId: detachFromClientFlight
      summary: Remove e exclui o anexo
      description: "Exige `crm:voos-clientes:excluir`."
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Voo sem o anexo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientFlight' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/flight-search/options:
    get:
      tags: [flight-search]
      operationId: getFlightSearchOptions
      summary: Origens fixas e se a SerpApi está configurada
      responses:
        '200':
          description: Opções.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightSearchOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crm/flight-search:
    post:
      tags: [flight-search]
      operationId: searchFlights
      summary: Cota ida e volta para cada destino
      description: |
        Exige `crm:pesquisa-voos:criar`. Sem chave da SerpApi: 503 `INTEGRATION_NOT_CONFIGURED`.
        Erros: `ORIGIN_NOT_ALLOWED`, `SAME_ORIGIN_DESTINATION`, `DUPLICATED_DESTINATION`, `DATES_REQUIRED`,
        `MONTHS_REQUIRED`, `INVALID_DATES`, `FLIGHT_SEARCH_TOO_BROAD` (422), `FLIGHT_SEARCH_QUOTA` (429),
        `FLIGHT_SEARCH_FAILED` (502). A mesma pesquisa repetida só renova o horário no histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlightSearchRequest' }
      responses:
        '200':
          description: Resultado por destino.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/crm/flight-search/recent:
    get:
      tags: [flight-search]
      operationId: recentFlightSearches
      summary: As 5 pesquisas mais recentes, prontas para "Refazer"
      responses:
        '200':
          description: Pesquisas.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RecentFlightSearch' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crm/flight-search/groups:
    get:
      tags: [flight-search]
      operationId: listFlightSearchGroups
      summary: Grupos de destinos
      responses:
        '200':
          description: Grupos.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FlightSearchGroup' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [flight-search]
      operationId: createFlightSearchGroup
      summary: Cria grupo (até 7 destinos)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlightSearchGroupRequest' }
      responses:
        '201':
          description: Grupo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightSearchGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/crm/flight-search/groups/{id}:
    put:
      tags: [flight-search]
      operationId: updateFlightSearchGroup
      summary: Edita grupo
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlightSearchGroupRequest' }
      responses:
        '200':
          description: Grupo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightSearchGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [flight-search]
      operationId: deleteFlightSearchGroup
      summary: Exclui grupo
      parameters: [ { $ref: '#/components/parameters/IdPath' } ]
      responses:
        '204': { description: Excluído. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crm/vouchers:
    get:
      tags: [vouchers]
      operationId: searchVouchers
      summary: Histórico de vouchers, mais recentes primeiro
      parameters:
        - { name: q, in: query, description: Nome do cliente ou número exato, schema: { type: string, maxLength: 100 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/VoucherType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VoucherStatus' } }
        - { name: from, in: query, description: 'Emitido a partir do dia', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Emitido até o dia', schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - { name: sort, in: query, description: 'issuedAt, serviceDate, clientName, number', schema: { type: string } }
      responses:
        '200':
          description: Página de vouchers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [vouchers]
      operationId: issueVoucher
      summary: Emite voucher (número VF-000001)
      description: "Exige `crm:vouchers:criar`. Erros 422: `VOUCHER_FIELDS_MISSING` (com `fields`), `CPF_INVALID`, `INVALID_DATES`, `FILE_CATEGORY_MISMATCH`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherRequest' }
      responses:
        '201':
          description: Voucher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/crm/vouchers/extract:
    post:
      tags: [vouchers]
      operationId: extractVoucher
      summary: Extrai os dados do serviço do PDF/imagem por IA
      description: |
        Exige `crm:vouchers:criar`. Sem provedor de IA: 503 `INTEGRATION_NOT_CONFIGURED` (a tela segue no manual).
        Nome, CPF, telefone e observações nunca são extraídos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fileId]
              properties:
                type: { $ref: '#/components/schemas/VoucherType' }
                fileId: { type: string, format: uuid }
      responses:
        '200':
          description: Campos para revisão.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherDetails' }
        '400': { $ref: '#/components/responses/BadRequest' }
