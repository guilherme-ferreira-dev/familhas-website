        tables:
          type: array
          items:
            type: object
            required: [table, inBackup, restored, kept, conflicts]
            properties:
              table: { type: string }
              inBackup: { type: integer }
              restored: { type: integer }
              kept: { type: integer, description: Já existe e fica como está }
